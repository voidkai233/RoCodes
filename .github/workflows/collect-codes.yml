name: Collect authorized Roblox code feeds
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rocodes-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect approved sources
        run: node scripts/collect-codes.mjs
      - name: Commit changed data
        run: |
          if ! git diff --quiet -- data/collected-codes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/collected-codes.json
            git commit -m "Update pending Roblox codes from authorized sources"
            git push
          fi
